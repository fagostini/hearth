name: hearth
description: "Hearth parent app: screen time, requests and rules for your children's Linux PC."
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  flutter_rust_bridge: 2.13.0
  flutter_secure_storage: ^11.2.0
  flutter_zxing: ^4.0.0
  freezed_annotation: ^3.1.0
  hearth_bridge:
    path: rust_builder
  material_ui: ^1.11.1
  path_provider: ^2.1.6
  unifiedpush: ^6.2.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage.ttf

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#171A2C"
  adaptive_icon_foreground: assets/icon/foreground.png
  ios: false # no ios/ project yet (needs a Mac to build)
  linux: false
