[package]
name = "hearth-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.2", optional = true }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[features]
# Phone side: pairing, sending and listening over the ntfy relay (used by the app).
client = ["dep:ureq"]

[[example]]
name = "phone"
required-features = ["client"]
