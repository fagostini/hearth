[package]
name = "hearthd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
evdev = { version = "0.13.2", features = ["tokio"] }
hearth-core = { version = "0.1.0", path = "../hearth-core" }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
libc = "0.2.191"
qrcode = "0.15.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "net", "io-util", "process"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = "3.5.2"
zbus = { version = "6.5.0", default-features = false, features = ["tokio", "proxy", "service"] }
