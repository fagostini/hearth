[package]
name = "hearthd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
evdev = { version = "0.13.2", features = ["tokio"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zbus = { version = "6.5.0", default-features = false, features = ["tokio", "proxy"] }
